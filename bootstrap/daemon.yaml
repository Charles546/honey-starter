# Daemon-level control plane and core driver connection data.
#
# Template environment contract: the config loader exposes ONLY environment
# variables prefixed HD_ to the `{% .env.X %}` templates, with the prefix
# stripped. So `{% .env.API_PORT %}` is fed by the real env var HD_API_PORT.
# Plain (non-HD_) env vars such as LOCALREDIS and VAULT_* are consumed
# directly by the daemon/driver processes and are NOT visible to templates.
# See deploy/README.md "Environment namespaces".
drivers:
  daemon:
    # How often the daemon's Watch() loop re-checks (and re-assembles) the
    # bootstrap config before invoking OnChange. The docker deployment feeds
    # HD_CONFIG_CHECK_INTERVAL through here and defaults it to 30m; the bare
    # default below (1m) applies only to a non-compose local daemon.
    #
    # Deliberate tradeoff (docker deployment): a local-dir init repo
    # (BRANCH unset) is treated by refreshRepo() as an "uncommitted working
    # dir" that returns true on EVERY tick, so the config is re-assembled
    # and reloaded unconditionally each interval — and every reload
    # re-resolves every Vault LOOKUP with a fresh AppRole login. 1m would
    # therefore mean per-minute AppRole churn and, while Vault is down, a
    # reload storm (the failed reload rolls back to the last-good raw config
    # which still holds undecrypted LOOKUP strings, so OnChange retries every
    # tick until Vault returns; /healthz flaps meanwhile). 30m is the
    # shipped default because it matches the smoke test and hd-home, and it
    # bounds both effects; the interval stays env-tunable. Once upstream
    # gains fsnotify-backed reloads, a per-minute (or instant) interval
    # becomes safe again — until then, prefer atomic writes when editing a
    # live config (see README "Config reload behavior").
    #
    # To disable periodic reloads entirely, set:
    #   daemon.watchConfig: false
    # and restart the daemon to apply config/secret changes.
    configCheckInterval: '{% default "1m" .env.CONFIG_CHECK_INTERVAL %}'
    # pod_id_signing_secret is intentionally ABSENT: it signs pod/agent
    # identifiers for github/kubernetes/podman integrations, none of which the
    # starter enables (init.yaml: without_github/kubernetes). Do not "fix" this
    # by adding it without also enabling one of those integrations.
    services:
      api:
        listener:
          addr: ':{% default "9000" .env.API_PORT %}'
        # Base URL of the Honeydipper UI. The API *store* consumes this only
        # when building SAML/OAuth provider redirect URLs
        # (internal/api/store.go, uiBase + /auth/saml/callback); startAPIListener
        # itself reads only listener.addr, api_prefix and healthcheck_prefix.
        # With auth-simple alone (no SAML/OAuth providers) this value is inert;
        # it matters once the UI is deployed (Phase 2). Fed by HD_UI_URL.
        ui_url: '{% default "" .env.UI_URL %}'
        auth:
          entitlementCacheTTL: 5m
    registries:
      # Registry backing the remote AI driver (see daemon.drivers.openai).
      # This is the *binary* registry (charles546.github.io/honeydipper-registry);
      # it is distinct from the git config repos (honey-starter init repo and
      # honeydipper-config-essentials). See README "Supply chain and network".
      charles-gh-pages:
        baseURL: https://charles546.github.io/honeydipper-registry
    drivers:
      openai:
        name: openai
        type: remote
        handlerData:
          registry: charles-gh-pages
          channel: stable
        description: OpenAI compatible model driver used by the starter agents.
        meta:
          labels:
            - agent_driver

  # ---- core driver connection data (Valkey/Redis) --------------------------
  # The defaults below target a local Valkey/Redis on 127.0.0.1:6379, correct
  # for a bare local daemon. In the docker-compose deployment every redis-backed
  # core driver (redisqueue, redispubsub, redislock, redis-cache, api-broadcast,
  # redis-scheduler) is redirected at runtime through the LOCALREDIS env var,
  # which overrides these connection blocks entirely, so the HD_VALKEY_*
  # template values are inert there. See deploy/README.md.
  redisqueue:
    connection:
      Addr: '{% default "127.0.0.1:6379" .env.VALKEY_ADDR %}'
      Password: '{% default "" .env.VALKEY_PASSWORD %}'
  redispubsub:
    connection:
      Addr: '{% default "127.0.0.1:6379" .env.VALKEY_ADDR %}'
      Password: '{% default "" .env.VALKEY_PASSWORD %}'
  redislock:
    connection:
      Addr: '{% default "127.0.0.1:6379" .env.VALKEY_ADDR %}'
      Password: '{% default "" .env.VALKEY_PASSWORD %}'
  redis-cache:
    connection:
      Addr: '{% default "127.0.0.1:6379" .env.VALKEY_ADDR %}'
      Password: '{% default "" .env.VALKEY_PASSWORD %}'
  api-broadcast:
    topic: honeydipper:api-broadcast
    channel: api
    connection:
      Addr: '{% default "127.0.0.1:6379" .env.VALKEY_ADDR %}'
      Password: '{% default "" .env.VALKEY_PASSWORD %}'

  # ---- Vault driver connection data ----------------------------------------
  # Intentionally EMPTY. The vault driver is configured entirely through plain
  # environment variables (VAULT_ADDR plus AppRole VAULT_ROLE_ID /
  # VAULT_SECRET_ID, the latter materialized from hd-secret-file:// values by
  # the container entrypoint). Do not declare `addr`/`token`/`k8sRole` here:
  # config values shadow the env fallback in the driver and the daemon must
  # never hold the Vault root token. Never set VAULT_K8S_ROLE (kubernetes auth
  # preempts AppRole in the driver). See deploy/README.md "Vault".
  vault: {}
