# Daemon-level control plane and core driver connection data.
#
# The connection settings for the core drivers point at a Valkey/Redis
# instance and can be overridden through the environment at config-load time
# (all values below are resolved when the config file is read).
drivers:
  daemon:
    # How often the daemon's Watch() loop re-checks (and re-assembles) the
    # bootstrap config before invoking OnChange. The upstream default is also
    # 1m; we pin it explicitly here because the contract states it.
    #
    # Note on local-dir init repos (BRANCH unset): refreshRepo() treats an
    # existing local path with no branch as "uncommitted working dir" and
    # therefore returns true on every tick, so the config is re-assembled and
    # reloaded unconditionally each interval (see README "Config reload
    # behavior"). To disable periodic reloads entirely, set:
    #   daemon.watchConfig: false
    configCheckInterval: 1m
    services:
      api:
        listener:
          addr: ':{% default "9000" .env.HD_API_PORT %}'
        # Base URL of the Honeydipper UI. The API *store* consumes this only
        # when building SAML/OAuth provider redirect URLs
        # (internal/api/store.go, uiBase + /auth/saml/callback); startAPIListener
        # itself reads only listener.addr, api_prefix and healthcheck_prefix.
        # With auth-simple alone (Phase 1, no SAML/OAuth providers) this value
        # is inert; it is retained for the Phase 2 UI and SAML wiring.
        ui_url: '{% default "" .env.HD_UI_URL %}'
        auth:
          entitlementCacheTTL: 5m
    registries:
      # Registry backing the remote AI driver (see daemon.drivers.openai).
      # This is the *binary* registry (charles546.github.io/honeydipper-registry);
      # it is distinct from the git config repos (honey-starter init repo and
      # honeydipper-config-essentials). See README "Supply chain and network".
      charles-gh-pages:
        baseURL: https://charles546.github.io/honeydipper-registry
    drivers:
      openai:
        name: openai
        type: remote
        handlerData:
          registry: charles-gh-pages
          channel: stable
        description: OpenAI compatible model driver used by the starter agents.
        meta:
          labels:
            - agent_driver

  # ---- core driver connection data (Valkey/Redis) --------------------------
  # 127.0.0.1:6379 is correct for a local daemon (Phase 1). When deployed via
  # docker-compose (Phase 2) this must be overridden to the valkey service
  # host (e.g. valkey:6379) through .env VALKEY_ADDR.
  redisqueue:
    connection:
      Addr: '{% default "127.0.0.1:6379" .env.VALKEY_ADDR %}'
      Password: '{% default "" .env.VALKEY_PASSWORD %}'
  redispubsub:
    connection:
      Addr: '{% default "127.0.0.1:6379" .env.VALKEY_ADDR %}'
      Password: '{% default "" .env.VALKEY_PASSWORD %}'
  redislock:
    connection:
      Addr: '{% default "127.0.0.1:6379" .env.VALKEY_ADDR %}'
      Password: '{% default "" .env.VALKEY_PASSWORD %}'
  redis-cache:
    connection:
      Addr: '{% default "127.0.0.1:6379" .env.VALKEY_ADDR %}'
      Password: '{% default "" .env.VALKEY_PASSWORD %}'
  api-broadcast:
    topic: honeydipper:api-broadcast
    channel: api
    connection:
      Addr: '{% default "127.0.0.1:6379" .env.VALKEY_ADDR %}'
      Password: '{% default "" .env.VALKEY_PASSWORD %}'

  # ---- Vault driver connection data ----------------------------------------
  # The Vault driver reads `data.addr` and `data.token` from its driver data
  # block; both can be overridden with VAULT_ADDR/VAULT_TOKEN environment
  # variables. Secrets referenced from other drivers via
  # `LOOKUP[vault,/secrets/data/<ns>/daemon#...]` resolve through this driver.
  vault:
    data:
      addr: '{% default "http://localhost:8200" .env.VAULT_ADDR %}'
      token: '{% default "" .env.VAULT_TOKEN %}'
